; ==================================================================
;  PHP-FPM RIÊNG cho website Viên Ngọc Phương (dịch vụ systemd: vienngocphuong-php)
;  Chạy độc lập với php8.3-fpm của các website khác trên máy chủ:
;  khởi động lại / đổi cấu hình ở đây không ảnh hưởng website khác.
;  Được chép vào /etc/vienngocphuong/php-fpm.conf bởi cong-cu/vps/cai-dat-may-chu.sh
; ==================================================================
[global]
pid = /run/php-vienngocphuong/php-fpm.pid
error_log = /var/log/php-fpm-vienngocphuong.log

[vienngocphuong]
user = vienngocphuong
group = vienngocphuong
listen = /run/php-vienngocphuong/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 60s
pm.max_requests = 500
request_terminate_timeout = 330s
catch_workers_output = yes

; Khóa giải mã kho bí mật (mật khẩu SMTP, khóa Cloudflare R2) – nằm ngoài thư mục website
env[VNP_SECRET_FILE] = /etc/vienngocphuong/khoa-bi-mat
env[TMPDIR] = /var/lib/vienngocphuong/tam

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/vienngocphuong/php-loi.log
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 25M
php_admin_value[post_max_size] = 30M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 120
php_admin_value[upload_tmp_dir] = /var/lib/vienngocphuong/tam
php_admin_value[sys_temp_dir] = /var/lib/vienngocphuong/tam
php_admin_value[session.save_path] = /var/lib/vienngocphuong/phien
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 100
php_admin_value[session.gc_maxlifetime] = 28800
; Website chỉ được đọc / ghi trong thư mục của nó
php_admin_value[open_basedir] = /var/www/vienngocphuong/:/var/lib/vienngocphuong/:/var/log/vienngocphuong/:/etc/vienngocphuong/khoa-bi-mat
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
