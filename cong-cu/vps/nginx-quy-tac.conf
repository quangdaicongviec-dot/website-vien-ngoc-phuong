# ==================================================================
#  Viên Ngọc Phương – quy tắc Nginx (tương đương file .htaccess)
#  Được chép vào /etc/nginx/snippets/vienngocphuong.conf bởi cong-cu/vps/cau-hinh-nginx.sh
#  → sửa ở file này trong mã nguồn, deploy là tự cập nhật (Nginx báo lỗi thì tự trả lại bản cũ).
# ==================================================================
root /var/www/vienngocphuong;
index index.php index.html;
charset utf-8;
client_max_body_size 30m;
server_tokens off;

access_log /var/log/nginx/vienngocphuong.access.log;
error_log  /var/log/nginx/vienngocphuong.error.log warn;

gzip_vary on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/plain text/css text/xml application/xml application/javascript text/javascript application/json image/svg+xml;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

error_page 404 /404.php;

# ---- Đường dẫn đẹp ----
rewrite ^/san-pham/([a-z0-9-]+)/?$ /chi-tiet.php?sp=$1 last;
rewrite ^/danh-muc/([a-z0-9-]+)/?$ /san-pham.php?danh-muc=$1 last;
rewrite ^/cam-nang/([a-z0-9-]+)/?$ /bai-viet.php?bv=$1 last;
rewrite ^/qua-tang/([a-z0-9-]+)/?$ /qua-tang.php?bst=$1 last;
rewrite ^/sitemap\.xml$ /sitemap.php last;
rewrite ^/robots\.txt$ /robots.php last;
rewrite ^/google-shopping\.xml$ /google-shopping.php last;

# ---- Chặn truy cập dữ liệu, mã nguồn, tệp ẩn ----
location = /config.php { deny all; }
location = /quan-tri { return 301 /quan-tri/; }
location ~ /\.(?!well-known/) { deny all; }
location ~ ^/(data|includes|anh-goc|tai-lieu|cong-cu)(/|$) { deny all; }
location ~ ^/quan-tri/(trang|lib\.php) { deny all; }
location ~* \.(md|csv|log|ini|sh|bak|sql|zip|lock|ya?ml|py|dist|txt)$ { deny all; }

# ---- Ảnh, CSS, JS, video (thư mục tải lên không bao giờ chạy mã) ----
location ^~ /assets/ {
    access_log off;
    expires 30d;
    location ~ /\. { deny all; }
    location ~* ^/assets/(img|videos)/uploads/.*\.(php\d?|phtml|phar|pl|py|cgi|sh|html?|svg|js|css)$ { deny all; }
    location ~* \.(css|js)$ { expires 1y; }
}

# ---- PHP: chỉ các trang ở thư mục gốc và trang quản trị ----
location ~ ^/quan-tri/index\.php$ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php-vienngocphuong/php-fpm.sock;
    fastcgi_read_timeout 330s;
    fastcgi_hide_header X-Frame-Options;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
location ~ ^/[a-z0-9-]+\.php$ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php-vienngocphuong/php-fpm.sock;
    fastcgi_read_timeout 120s;
}
location ~ \.php$ { return 404; }

# /lien-he → lien-he.php
location / {
    try_files $uri $uri/ @php;
}
location @php {
    if (-f $document_root$uri.php) {
        rewrite ^ $uri.php last;
    }
    return 404;
}
