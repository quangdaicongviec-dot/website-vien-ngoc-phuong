# ==================================================================
#  Tự đưa website lên VPS mỗi khi có thay đổi trên nhánh main
#  (hoặc bấm "Run workflow" trong tab Actions để chạy lại bằng tay).
#
#  Cần các Secrets của repo (Settings → Secrets and variables → Actions):
#    SSH_HOST, SSH_PORT, SSH_USERNAME (root), SSH_PASSWORD
#
#  Chỉ đưa MÃ NGUỒN lên /var/www/vienngocphuong. Dữ liệu do website tạo ra (đơn hàng, nội dung đã sửa,
#  tài khoản quản trị, ảnh đã tải lên) KHÔNG nằm trong repo và KHÔNG bị ghi đè / xóa – xem cong-cu/vps/khong-dua-len.txt.
# ==================================================================
name: Đưa website lên VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_DIR: /var/www/vienngocphuong
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v5

      - name: Kiểm tra lỗi cú pháp PHP
        run: |
          php -v | head -1
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null
          bash -n cong-cu/vps/cai-dat-may-chu.sh cong-cu/vps/cau-hinh-nginx.sh cong-cu/vps/tu-dong-ssl.sh

      - name: Chuẩn bị kết nối tới VPS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Khóa nhận diện của VPS – chống kết nối nhầm sang máy chủ giả mạo
          echo "vienngocphuong-vps ssh-rsa " > ~/.ssh/known_hosts
          echo "SSH_CMD=ssh -p ${SSH_PORT:-22} -o HostKeyAlias=vienngocphuong-vps -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o ConnectTimeout=30 -o ServerAliveInterval=30" >> "$GITHUB_ENV"

      - name: Đưa mã nguồn lên VPS (giữ nguyên dữ liệu và ảnh đã tải lên)
        run: |
          rsync -rlptz --delete --chmod=D755,F644 \
            --exclude-from=cong-cu/vps/khong-dua-len.txt \
            -e "sshpass -e $SSH_CMD" \
            ./ "$SSH_USERNAME@$SSH_HOST:$WEB_DIR/"

      - name: Cài đặt & kiểm tra trên VPS
        run: sshpass -e $SSH_CMD "$SSH_USERNAME@$SSH_HOST" "bash $WEB_DIR/cong-cu/vps/cai-dat-may-chu.sh"
